name: Bug report
description: Report a reproducible Markflow issue (without sharing private annotations)
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a public test URL or an example page, not a private page
      placeholder: "1. Open… 2. Select… 3. Click…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual behavior
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Browser and version
      placeholder: "Chrome 130 on Windows 11"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private URLs, notes, personal data, and tokens from this report.
          required: true
